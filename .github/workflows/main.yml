name: Build Firmware

on:
  push:
    branches: [ motorola_r7 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python/Docker & Compile directly
      run: |
        docker build -t uvk1-env .
        docker run --rm -v ${{ github.workspace }}:/src uvk1-env python3 -m pip install --upgrade pip || true
        docker run --rm -v ${{ github.workspace }}:/src uvk1-env make

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifact
        path: build/**/*.bin
